  <text x="84" y="180" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="58" font-weight="700" fill="#0a4d8c" opacity="0.22">Victor Banchón</text>
  <text x="84" y="177" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="58" font-weight="700" fill="url(#glossG)">Victor Banchón</text>
  <text x="84" y="177" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="58" font-weight="700" fill="#ffffff" opacity="0.36" clip-path="url(#nameTopClip)">Victor Banchón</text>

  <text x="84" y="216" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="20" font-weight="600" fill="#063a5e">Diseño de interfaces y desarrollo frontend</text>
  <text x="84" y="246" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="13.5" fill="#063a5e" opacity="0.66">Manta, Ecuador · ULEAM · Software y producto</text>
  <text x="664" y="246" text-anchor="end" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="13.5" fill="#063a5e" opacity="0.66">codidevs.com</text>

