<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Victor Banchón, CodiDevs</title>
  <desc id="bannerDesc">Banner de perfil: Victor Banchón, diseño de interfaces y desarrollo frontend en CodiDevs, Manta, Ecuador.</desc>

  <defs>
    <linearGradient id="bgWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14294B"/>
      <stop offset="0.55" stop-color="#0D1A30"/>
      <stop offset="1" stop-color="#0A1222"/>
    </linearGradient>
    <pattern id="blueprint" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F3864" stroke-width="1" opacity="0.38"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bgWash)"/>
  <rect width="1200" height="300" fill="url(#blueprint)"/>

  <rect x="0" y="0" width="1200" height="3" fill="#C9A227" opacity="0.75"/>

  <circle cx="884" cy="150" r="17" fill="none" stroke="#C9A227" stroke-width="1" opacity="0.45"/>
  <circle cx="1104" cy="150" r="17" fill="none" stroke="#C9A227" stroke-width="1" opacity="0.45"/>

  <path d="M884 150 L994 90" stroke="#1F3864" stroke-width="2"/>
  <path d="M884 150 L994 210" stroke="#1F3864" stroke-width="2"/>
  <path d="M994 90 L1104 150" stroke="#1F3864" stroke-width="2"/>
  <path d="M994 210 L1104 150" stroke="#1F3864" stroke-width="2"/>

  <circle cx="884" cy="150" r="8" fill="#C9A227"/>
  <circle cx="994" cy="90" r="5" fill="#1F3864" stroke="#C9A227" stroke-width="2"/>
  <circle cx="994" cy="210" r="5" fill="#1F3864" stroke="#C9A227" stroke-width="2"/>
  <circle cx="1104" cy="150" r="8" fill="#C9A227"/>

  <text x="72" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="9" fill="#C9A227">CODIDEVS</text>
  <rect x="72" y="110" width="54" height="3" fill="#C9A227" opacity="0.9"/>

