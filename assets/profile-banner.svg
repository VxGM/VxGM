    </clipPath>
    <g id="drop">
      <circle r="3" fill="#ffffff" opacity="0.26"/>
      <circle r="3" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.6"/>
      <circle cx="-1" cy="-1.1" r="1.05" fill="#ffffff" opacity="0.95"/>
      <path d="M -2.3 1.7 A 3 3 0 0 0 2.3 1.7" stroke="#0a4d8c" stroke-width="0.6" fill="none" opacity="0.22"/>
    </g>
    <g id="star">
