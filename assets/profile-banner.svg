    <text x="178" y="101" text-anchor="middle" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="13.5" font-weight="700" letter-spacing="3.6" fill="#0a4d8c">CODIDEVS</text>
