<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Victor Banchón, CodiDevs</title>
  <desc id="bannerDesc">Banner Frutiger Aero inmersivo: cielo luminoso con sol, destellos de lente y arcoíris, colinas de césped con rocío, burbujas de vidrio flotando y un pez tropical, con el nombre Victor Banchón sobre un panel de vidrio con gotas de agua. Animación declarativa que respeta prefers-reduced-motion.</desc>

  <style>
    .float-a{animation:floatA 6.5s ease-in-out infinite}
    .float-b{animation:floatA 8.2s ease-in-out -2.4s infinite}
    .float-c{animation:floatA 7.1s ease-in-out -4.1s infinite}
    .float-d{animation:floatA 9.3s ease-in-out -1.2s infinite}
    .cloud-a{animation:drift 26s ease-in-out infinite}
    .cloud-b{animation:drift 34s ease-in-out -11s infinite}
    .sheen{animation:sweep 9s ease-in-out 1.4s infinite}
    .fish{animation:bob 5.5s ease-in-out infinite}
    .rays{animation:rays 7s ease-in-out infinite}
    .tw1{animation:tw 3.4s ease-in-out infinite}
    .tw2{animation:tw 4.3s ease-in-out -1.5s infinite}
    .tw3{animation:tw 2.9s ease-in-out -0.8s infinite}
    @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
    @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
    @keyframes sweep{0%{transform:translateX(-280px)}42%{transform:translateX(780px)}100%{transform:translateX(780px)}}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-7px) rotate(1.8deg)}}
    @keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
    @keyframes rays{0%,100%{opacity:.5}50%{opacity:1}}
    @media (prefers-reduced-motion: reduce){
      .float-a,.float-b,.float-c,.float-d,.cloud-a,.cloud-b,.sheen,.fish,.rays,.tw1,.tw2,.tw3{animation:none}
    }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#0a4d8c"/>
      <stop offset="0.34" stop-color="#1f8fd6"/>
      <stop offset="0.62" stop-color="#4cc2ff"/>
      <stop offset="0.85" stop-color="#a8e2ff"/>
      <stop offset="1" stop-color="#e4f8ff"/>
    </linearGradient>
    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.30" stop-color="#fff8d6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe89a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayG" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bubbleG" cx="0.32" cy="0.26" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.64" stop-color="#d6f2ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8fd8ff" stop-opacity="0.10"/>
    </radialGradient>
    <linearGradient id="fishG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc95e"/>
      <stop offset="0.45" stop-color="#ff9a2e"/>
      <stop offset="0.8" stop-color="#f76a1e"/>
      <stop offset="1" stop-color="#d84a1e"/>
    </linearGradient>
    <linearGradient id="finG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb53e"/>
      <stop offset="1" stop-color="#d84a1e"/>
    </linearGradient>
    <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.42" stop-color="#e2f5ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a8e2ff" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="glassTopG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="sheenG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="caustG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="glossG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b5787"/>
      <stop offset="0.40" stop-color="#063a5e"/>
      <stop offset="0.48" stop-color="#0a5f9e"/>
      <stop offset="0.72" stop-color="#0078d7"/>
      <stop offset="1" stop-color="#063a5e"/>
    </linearGradient>
    <linearGradient id="grassFarG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2e82e"/>
      <stop offset="1" stop-color="#6b9c0e"/>
    </linearGradient>
    <linearGradient id="grassNearG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad614"/>
      <stop offset="1" stop-color="#24420c"/>
    </linearGradient>
    <filter id="blur14" x="-40%" y="-140%" width="180%" height="380%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blur9" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#063a5e" flood-opacity="0.32"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="52" y="48" width="640" height="224" rx="24"/>
    </clipPath>
    <clipPath id="nameTopClip">
