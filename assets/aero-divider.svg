<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="Divisor decorativo estilo Frutiger Aero: olas de vidrio con burbujas ascendentes y destellos de sol">
  <style>
    .wave-a{animation:drift 7.4s ease-in-out infinite}
    .wave-b{animation:drift 9.6s ease-in-out -3s infinite}
    .wave-c{animation:drift 6.4s ease-in-out -1.6s infinite}
    .r1{animation:rise 4.2s linear infinite}
    .r2{animation:rise 5.1s linear -1.2s infinite}
    .r3{animation:rise 3.8s linear -2.1s infinite}
    .r4{animation:rise 5.8s linear -.6s infinite}
    .r5{animation:rise 4.7s linear -3s infinite}
    .r6{animation:rise 6.3s linear -1.7s infinite}
    .r7{animation:rise 4.9s linear -3.6s infinite}
    .sp1{animation:tw 2.2s ease-in-out infinite}
    .sp2{animation:tw 3s ease-in-out -.8s infinite}
    .sp3{animation:tw 2.6s ease-in-out -1.5s infinite}
    .sp4{animation:tw 3.4s ease-in-out -.4s infinite}
    .tw1{animation:tw 3.2s ease-in-out infinite}
    .tw2{animation:tw 4.1s ease-in-out -1.5s infinite}
    .tw3{animation:tw 2.7s ease-in-out -.7s infinite}
    .glint3{animation:glint3 5.5s linear infinite}
    @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
    @keyframes rise{0%{transform:translateY(34px);opacity:0}18%{opacity:.85}78%{opacity:.6}100%{transform:translateY(-30px);opacity:0}}
    @keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
    @keyframes glint3{0%{transform:translateX(0)}60%{transform:translateX(1560px)}100%{transform:translateX(1560px)}}
  </style>

  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2b93d8"/>
      <stop offset="0.55" stop-color="#74cdfb"/>
      <stop offset="1" stop-color="#a8e4ff"/>
    </linearGradient>
    <linearGradient id="wave1G" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#4fb4ec" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wave2G" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#1a86cf" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="wave3G" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf9ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0d6fbd" stop-opacity="0.88"/>
    </linearGradient>
    <radialGradient id="sunG3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff8d6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe89a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubbleG3" cx="0.32" cy="0.26" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fd8ff" stop-opacity="0.12"/>
    </radialGradient>
    <clipPath id="divClip"><rect x="0" y="0" width="1200" height="72" rx="18"/></clipPath>
    <g id="star3">
      <path d="M0 -3.4 L0.9 -0.9 L3.4 0 L0.9 0.9 L0 3.4 L-0.9 0.9 L-3.4 0 L-0.9 -0.9 Z" fill="#ffffff"/>
    </g>
  </defs>

  <g clip-path="url(#divClip)">
    <rect width="1200" height="72" fill="url(#sky3)"/>
    <circle cx="1120" cy="4" r="88" fill="url(#sunG3)"/>
    <circle cx="1044" cy="14" r="4" fill="#ffffff" opacity="0.2"/>
    <circle cx="984" cy="24" r="2.6" fill="#7df9ff" opacity="0.22"/>

    <g class="wave-a">
      <path d="M-20 50 C 140 42 300 58 460 52 C 620 46 760 44 920 50 C 1060 55 1150 56 1220 52 L1220 72 L-20 72 Z" fill="url(#wave1G)"/>
    </g>
    <g class="wave-b">
      <path d="M-20 58 C 160 50 340 64 520 59 C 700 54 880 50 1060 57 C 1140 60 1190 59 1220 58 L1220 72 L-20 72 Z" fill="url(#wave2G)"/>
    </g>
    <g class="wave-c">
      <path d="M-20 65 C 180 59 420 69 640 64 C 840 60 1040 58 1220 64 L1220 72 L-20 72 Z" fill="url(#wave3G)"/>
      <path d="M-20 65 C 180 59 420 69 640 64 C 840 60 1040 58 1220 64" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.85"/>
    </g>
    <g class="wave-b">
      <path d="M-20 58 C 160 50 340 64 520 59 C 700 54 880 50 1060 57 C 1140 60 1190 59 1220 58" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-opacity="0.6"/>
    </g>

    <g class="r1"><circle cx="120" cy="48" r="4.4" fill="url(#bubbleG3)"/><circle cx="120" cy="48" r="4.4" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/></g>
    <g class="r2"><circle cx="265" cy="54" r="3" fill="url(#bubbleG3)"/><circle cx="265" cy="54" r="3" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.65"/></g>
    <g class="r3"><circle cx="420" cy="46" r="5" fill="url(#bubbleG3)"/><circle cx="420" cy="46" r="5" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/></g>
    <g class="r4"><circle cx="585" cy="56" r="2.6" fill="url(#bubbleG3)"/><circle cx="585" cy="56" r="2.6" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/></g>
    <g class="r5"><circle cx="740" cy="48" r="4" fill="url(#bubbleG3)"/><circle cx="740" cy="48" r="4" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/></g>
    <g class="r6"><circle cx="905" cy="52" r="3.2" fill="url(#bubbleG3)"/><circle cx="905" cy="52" r="3.2" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.65"/></g>
    <g class="r7"><circle cx="1065" cy="46" r="4.6" fill="url(#bubbleG3)"/><circle cx="1065" cy="46" r="4.6" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/></g>

    <use href="#star3" class="tw1" transform="translate(210 46) scale(0.8)"/>
    <use href="#star3" class="tw2" transform="translate(505 52) scale(0.65)"/>
    <use href="#star3" class="tw3" transform="translate(815 50) scale(0.85)"/>
    <use href="#star3" class="tw1" transform="translate(1010 44) scale(0.7)"/>
    <use href="#star3" class="tw2" transform="translate(660 58) scale(0.6)"/>
  </g>
  <rect x="0.6" y="0.6" width="1198.8" height="70.8" rx="17.4" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.2"/>

  <defs>
    <linearGradient id="glintG3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <g id="spark3"><path d="M0 -7 L1.7 -1.7 L7 0 L1.7 1.7 L0 7 L-1.7 1.7 L-7 0 L-1.7 -1.7 Z" fill="#ffffff"/></g>
  </defs>

  <g clip-path="url(#divClip)">
    <g class="glint3"><rect x="-260" y="0" width="240" height="72" fill="url(#glintG3)"/></g>
    <use href="#spark3" class="sp1" transform="translate(240,26)"/>
    <use href="#spark3" class="sp2" transform="translate(470,44) scale(0.75)"/>
    <use href="#spark3" class="sp3" transform="translate(700,22) scale(0.85)"/>
    <use href="#spark3" class="sp4" transform="translate(980,38) scale(0.7)"/>
    <use href="#spark3" class="sp1" transform="translate(1120,20) scale(0.6)"/>
  </g>
</svg>
