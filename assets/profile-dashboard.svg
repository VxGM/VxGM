<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" role="img" aria-labelledby="panelTitle panelDesc">
  <title id="panelTitle">Áreas de trabajo de Victor Banchón</title>
  <desc id="panelDesc">Panel de vidrio estilo Frutiger Aero sobre un paisaje de cielo y césped, con barras brillantes que muestran las áreas de trabajo: diseño UI/UX y design systems, frontend con React y Tailwind, identidad visual y landings, producto y MVPs, automatización e IA aplicada. Animación declarativa que respeta prefers-reduced-motion.</desc>

  <style>
    .float-a{animation:floatA 6.8s ease-in-out infinite}
    .float-b{animation:floatA 8.6s ease-in-out -2.6s infinite}
    .float-c{animation:floatA 7.4s ease-in-out -4.3s infinite}
    .sheen{animation:sweep 9s ease-in-out 2s infinite both}
    .tw1{animation:tw 3.6s ease-in-out infinite}
    .tw2{animation:tw 4.4s ease-in-out -1.6s infinite}
    .bar{transform-box:fill-box;transform-origin:left center;animation:barIn 1.15s cubic-bezier(.25,.9,.3,1) both}
    .b1{animation-delay:.15s}
    .b2{animation-delay:.3s}
    .b3{animation-delay:.45s}
    .b4{animation-delay:.6s}
    .b5{animation-delay:.75s}
    @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
    @keyframes sweep{0%{transform:translateX(0)}40%{transform:translateX(820px)}100%{transform:translateX(820px)}}
    @keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
    @keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){
      .float-a,.float-b,.float-c,.sheen,.tw1,.tw2,.bar{animation:none}
    }
  </style>

  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1f8fd6"/>
      <stop offset="0.48" stop-color="#4cc2ff"/>
      <stop offset="0.8" stop-color="#a8e2ff"/>
      <stop offset="1" stop-color="#e4f8ff"/>
    </linearGradient>
    <radialGradient id="sunG2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#fff8d6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffe89a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubbleG2" cx="0.32" cy="0.26" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.30" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.66" stop-color="#d6f2ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8fd8ff" stop-opacity="0.08"/>
    </radialGradient>
    <linearGradient id="panelG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="0.44" stop-color="#e2f5ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a8e2ff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="glassTopG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="sheenG2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="caustG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="barG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5d610"/>
      <stop offset="0.5" stop-color="#5ecf6a"/>
      <stop offset="1" stop-color="#00c8c8"/>
    </linearGradient>
    <linearGradient id="grassFarG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2e82e"/>
      <stop offset="1" stop-color="#6b9c0e"/>
    </linearGradient>
    <linearGradient id="grassNearG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad614"/>
      <stop offset="1" stop-color="#2f5410"/>
    </linearGradient>
    <filter id="panelShadow2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#063a5e" flood-opacity="0.32"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="520" height="380" rx="18"/>
    </clipPath>
    <clipPath id="panelClip2">
      <rect x="24" y="24" width="472" height="332" rx="20"/>
    </clipPath>
    <g id="drop2">
      <circle r="2.6" fill="#ffffff" opacity="0.26"/>
      <circle r="2.6" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
      <circle cx="-0.9" cy="-0.95" r="0.9" fill="#ffffff" opacity="0.95"/>
      <path d="M -2 1.5 A 2.6 2.6 0 0 0 2 1.5" stroke="#0a4d8c" stroke-width="0.5" fill="none" opacity="0.22"/>
    </g>
    <g id="star2">
      <path d="M0 -3.6 L0.95 -0.95 L3.6 0 L0.95 0.95 L0 3.6 L-0.95 0.95 L-3.6 0 L-0.95 -0.95 Z" fill="#ffffff"/>
    </g>
    <g id="tuft2">
      <path d="M0 0 Q-3 -9 -6 -12 Q-2 -8 -1 0 Z"/>
      <path d="M0 0 Q0 -11 1 -15 Q3 -9 3 0 Z"/>
      <path d="M2 0 Q5 -8 9 -11 Q5 -5 4 0 Z"/>
    </g>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="520" height="380" fill="url(#sky2)"/>
    <circle cx="452" cy="300" r="248" fill="none" stroke="#f7941e" stroke-width="10" opacity="0.14"/>
    <circle cx="452" cy="300" r="234" fill="none" stroke="#a5d610" stroke-width="10" opacity="0.13"/>
    <circle cx="430" cy="52" r="96" fill="url(#sunG2)"/>
    <circle cx="345" cy="74" r="7" fill="#ffffff" opacity="0.14"/>
    <circle cx="292" cy="92" r="4.5" fill="#7df9ff" opacity="0.15"/>

    <path d="M0 380 L60 380 C 150 379 210 340 300 336 C 380 333 450 352 520 362 L520 380 Z" fill="url(#grassFarG2)"/>
    <g fill="#7ab800" opacity="0.95">
      <use href="#tuft2" transform="translate(155 372) scale(1.1)"/>
      <use href="#tuft2" transform="translate(205 356) scale(1.3)"/>
      <use href="#tuft2" transform="translate(262 342) scale(1.15)"/>
      <use href="#tuft2" transform="translate(322 336) scale(1.35)"/>
      <use href="#tuft2" transform="translate(388 342) scale(1.1)"/>
      <use href="#tuft2" transform="translate(452 354) scale(1.25)"/>
    </g>
    <path d="M0 364 C 70 358 130 354 150 354 C 250 353 320 366 400 374 C 450 379 490 380 520 380 L520 380 L0 380 Z" fill="url(#grassNearG2)"/>
    <g fill="#4d7a10" opacity="0.95">
      <use href="#tuft2" transform="translate(10 365) scale(1.2)"/>
      <use href="#tuft2" transform="translate(48 360) scale(1.4)"/>
      <use href="#tuft2" transform="translate(96 356) scale(1.2)"/>
      <use href="#tuft2" transform="translate(150 354) scale(1.45)"/>
      <use href="#tuft2" transform="translate(214 357) scale(1.2)"/>
      <use href="#tuft2" transform="translate(284 364) scale(1.35)"/>
      <use href="#tuft2" transform="translate(356 372) scale(1.15)"/>
    </g>
    <g>
      <use href="#star2" class="tw1" transform="translate(120 358) scale(0.8)"/>
      <use href="#star2" class="tw2" transform="translate(250 356) scale(0.65)"/>
      <use href="#star2" class="tw1" transform="translate(380 340) scale(0.7)"/>
      <use href="#star2" class="tw2" transform="translate(465 358) scale(0.75)"/>
    </g>

    <g class="float-a">
      <circle cx="404" cy="150" r="34" fill="url(#bubbleG2)"/>
      <circle cx="404" cy="150" r="34" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.7"/>
      <ellipse cx="392" cy="136" rx="10" ry="6" fill="#ffffff" opacity="0.9" transform="rotate(-22 392 136)"/>
    </g>
    <g class="float-b">
      <circle cx="452" cy="238" r="18" fill="url(#bubbleG2)"/>
      <circle cx="452" cy="238" r="18" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.65"/>
      <ellipse cx="446" cy="230.5" rx="5" ry="3.1" fill="#ffffff" opacity="0.88" transform="rotate(-22 446 230.5)"/>
    </g>
    <g class="float-c">
      <circle cx="368" cy="272" r="11" fill="url(#bubbleG2)"/>
      <circle cx="368" cy="272" r="11" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
      <ellipse cx="364.3" cy="267.6" rx="3.1" ry="1.9" fill="#ffffff" opacity="0.85" transform="rotate(-22 364.3 267.6)"/>
    </g>
  </g>

  <g filter="url(#panelShadow2)">
    <rect x="24" y="24" width="472" height="332" rx="20" fill="url(#panelG2)" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.85"/>
  </g>
  <g clip-path="url(#panelClip2)">
    <rect x="24" y="24" width="472" height="156" fill="url(#glassTopG2)"/>
    <g transform="rotate(24 55 200)">
      <g class="sheen">
        <rect x="-280" y="-90" width="100" height="580" fill="url(#sheenG2)"/>
      </g>
    </g>
    <rect x="24" y="316" width="472" height="40" fill="url(#caustG2)" opacity="0.5"/>
  </g>
  <rect x="24" y="24" width="472" height="332" rx="20" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>

  <g>
    <use href="#drop2" transform="translate(64 38) scale(1.1)"/>
    <use href="#drop2" transform="translate(128 34) scale(0.75)"/>
    <use href="#drop2" transform="translate(214 40) scale(0.95)"/>
    <use href="#drop2" transform="translate(330 36) scale(0.8)"/>
    <use href="#drop2" transform="translate(452 42) scale(1.15)"/>
    <use href="#drop2" transform="translate(478 120) scale(0.8)"/>
    <use href="#drop2" transform="translate(40 250) scale(0.85)"/>
    <use href="#drop2" transform="translate(480 300) scale(1)"/>
  </g>

  <text x="48" y="74" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="21" font-weight="700" fill="#063a5e">Áreas de trabajo</text>
  <text x="48" y="97" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="13.5" fill="#0a4d8c" opacity="0.72">Diseño, frontend y automatización</text>
  <text x="48" y="134" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="15" font-weight="600" fill="#063a5e">Diseño UI/UX y design systems</text>
  <text x="48" y="178" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="15" font-weight="600" fill="#063a5e">Frontend con React y Tailwind</text>
  <text x="48" y="222" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="15" font-weight="600" fill="#063a5e">Identidad visual y landings</text>
  <text x="48" y="266" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="15" font-weight="600" fill="#063a5e">Producto y MVPs</text>
  <text x="48" y="310" font-family="'Segoe UI', Frutiger, 'Trebuchet MS', system-ui, sans-serif" font-size="15" font-weight="600" fill="#063a5e">Automatización e IA aplicada</text>

  <rect x="48" y="144" width="424" height="12" rx="6" fill="#0a4d8c" opacity="0.15" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
  <g class="bar b1"><rect x="48" y="144" width="403" height="12" rx="6" fill="url(#barG)"/><rect x="53" y="146" width="393" height="3.5" rx="1.75" fill="#ffffff" opacity="0.55"/></g>
  <rect x="48" y="188" width="424" height="12" rx="6" fill="#0a4d8c" opacity="0.15" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
  <g class="bar b2"><rect x="48" y="188" width="382" height="12" rx="6" fill="url(#barG)"/><rect x="53" y="190" width="372" height="3.5" rx="1.75" fill="#ffffff" opacity="0.55"/></g>
  <rect x="48" y="232" width="424" height="12" rx="6" fill="#0a4d8c" opacity="0.15" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
  <g class="bar b3"><rect x="48" y="232" width="360" height="12" rx="6" fill="url(#barG)"/><rect x="53" y="234" width="350" height="3.5" rx="1.75" fill="#ffffff" opacity="0.55"/></g>
  <rect x="48" y="276" width="424" height="12" rx="6" fill="#0a4d8c" opacity="0.15" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
  <g class="bar b4"><rect x="48" y="276" width="331" height="12" rx="6" fill="url(#barG)"/><rect x="53" y="278" width="321" height="3.5" rx="1.75" fill="#ffffff" opacity="0.55"/></g>
  <rect x="48" y="320" width="424" height="12" rx="6" fill="#0a4d8c" opacity="0.15" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1"/>
  <g class="bar b5"><rect x="48" y="320" width="297" height="12" rx="6" fill="url(#barG)"/><rect x="53" y="322" width="287" height="3.5" rx="1.75" fill="#ffffff" opacity="0.55"/></g>
</svg>
