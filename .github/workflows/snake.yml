name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0078d7&color_dots=#eaf8ff,#b9ecff,#7ab800,#a5d610,#0078d7
            dist/github-contribution-grid-snake-dark.svg?color_snake=#a5d610&color_dots=#0d2b45,#1a5a8a,#2f9fe0,#7ab800,#a5d610
            dist/ocean.gif?color_snake=#0078d7&color_dots=#eaf8ff,#b9ecff,#7ab800,#a5d610,#0078d7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
